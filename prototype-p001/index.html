<body>

    <div><label for="concept-switch">Concept</label><select id="concept-switch"><option value="A" selected>A · Visual simplification</option><option value="B">B · Tham chiếu</option><option value="C">C · Tham chiếu</option></select><a href="review.html">Khung review <span aria-hidden="true">↗</span></a></div>

  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="search-surface"><div class="search-dialog-heading"><h2 id="search-title">Bạn đang cần tìm gì?</h2><button type="button" class="icon-button" data-search-close aria-label="Đóng tìm kiếm"><span aria-hidden="true">×</span></button></div>

    <p>Thử luồng đề xuất một đường dẫn. Bản mẫu không gửi hoặc lưu thông tin.</p>
    <form id="contribution-form">
      <label>Đường dẫn chính thức<input type="url" name="url" required maxlength="500" placeholder="https://..."></label>
      <label>Điều gì khiến tài nguyên này hữu ích?<textarea name="reason" required minlength="8" maxlength="700" rows="3" placeholder="Dùng cho ai, giải quyết việc gì…"></textarea></label>
      <button class="button" type="submit">Xem đề xuất mẫu <span aria-hidden="true">→</span></button>
      <p id="contribution-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
